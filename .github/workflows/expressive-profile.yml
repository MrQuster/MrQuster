name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  watch:
    types: [started]
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Full-width 3-column projects row
        run: |
          python3 - <<'PY'
          import re
          with open("README.md", "r", encoding="utf-8") as f:
              s = f.read()
          cards = re.findall(r'<a href="[^"]+"><picture>.*?project-[^"]+-light\.svg.*?</picture></a>', s)
          if len(cards) == 3:
              row = "&nbsp;".join(c.replace('width="49%"', 'width="32.5%"') for c in cards)
              s = re.sub(
                  r'<a href="[^"]+"><picture>.*?project-[^"]+-light\.svg.*?</picture></a>(?:\s|&nbsp;)*'
                  r'<a href="[^"]+"><picture>.*?project-[^"]+-light\.svg.*?</picture></a>\s*'
                  r'<a href="[^"]+"><picture>.*?project-[^"]+-light\.svg.*?</picture></a>',
                  row,
                  s,
                  flags=re.S,
              )
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Format 3-column full-width projects row" && git push)
